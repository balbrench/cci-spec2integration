name: Release VS Code Extension

# Builds the Spec2Integration .vsix and attaches it to a GitHub Release.
# The extension is distributed via GitHub Releases (not the VS Code Marketplace).
#
# Trigger: push a tag like `v1.0.4`. The version is derived from the tag (the
# leading `v` is stripped); for manual runs it falls back to package.json. You
# can also run it manually from the Actions tab.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write # required to create a Release and upload the .vsix asset

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/vscode-extension

    steps:
      - name: Checkout (full history for asset sync git sha)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tools/vscode-extension/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Resolve release version
        id: ext
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(node -p "require('./package.json').version")"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Release version: $VERSION"

      - name: Align package.json version with the tag
        if: github.ref_type == 'tag'
        run: npm version "${{ steps.ext.outputs.version }}" --no-git-tag-version --allow-same-version

      - name: Sync bundled assets
        run: npm run sync-assets

      - name: Package VSIX
        run: npx --yes @vscode/vsce package --no-dependencies --out "spec2integration-${{ steps.ext.outputs.version }}.vsix"

      - name: Upload VSIX as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: spec2integration-${{ steps.ext.outputs.version }}
          path: tools/vscode-extension/spec2integration-${{ steps.ext.outputs.version }}.vsix
          if-no-files-found: error

      - name: Create / update GitHub Release and attach VSIX
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: tools/vscode-extension/spec2integration-${{ steps.ext.outputs.version }}.vsix
          generate_release_notes: true
          fail_on_unmatched_files: true
